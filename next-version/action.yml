name: Next Version
description: Calculate the next semantic version from git tags and commit messages

inputs:
  change_path:
    description: 'Path to check for changes'
    required: false
    default: '.'
  tag_pattern:
    description: 'Tag pattern to search for'
    required: false
    default: 'v'
  bump_version:
    description: 'Force version bump even if no changes detected (true/false)'
    required: false
    default: 'false'
  version_line:
    description: 'Pin to a specific major line (numeric, e.g. "2"): tag lookup is restricted to `<tag_pattern><version_line>.*` and a (MAJOR) bump is rejected, so a maintenance branch keeps releasing on its own major. (MINOR)/patch bumps still apply. Empty = highest tag matching tag_pattern (previous behavior).'
    required: false
    default: ''

outputs:
  version:
    description: "Semantic version"
    value: ${{ steps.semver.outputs.version }}
  major:
    description: "Major version"
    value: ${{ steps.semver.outputs.major }}
  minor:
    description: "Minor version"
    value: ${{ steps.semver.outputs.minor }}
  patch:
    description: "Patch version"
    value: ${{ steps.semver.outputs.patch }}
  changed:
    description: "Whether files changed"
    value: ${{ steps.semver.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Calculate Semantic Version
      id: semver
      env:
        CHANGE_PATH: ${{ inputs.change_path }}
        TAG_PATTERN: ${{ inputs.tag_pattern }}
        BUMP_VERSION: ${{ inputs.bump_version }}
        VERSION_LINE: ${{ inputs.version_line }}
        # Passed through the environment rather than interpolated into the
        # script body: expression results must never become shell syntax.
        EVENT_NAME: ${{ github.event_name }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        HEAD_SHA: ${{ github.sha }}
      shell: bash
      run: |
        #!/bin/bash
        set -euo pipefail

        # Without full history `git tag -l` finds nothing, the action would
        # silently restart at 0.0.1 and overwrite a released version.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::shallow checkout - use actions/checkout with fetch-depth: 0"
          exit 1
        fi

        echo "=== Checking for changes in ${CHANGE_PATH} ==="

        if [ "$EVENT_NAME" == "pull_request" ]; then
          BASE_COMMIT="$PR_BASE_SHA"
          HEAD_COMMIT="$PR_HEAD_SHA"
        else
          if [ "$PUSH_BEFORE" == "0000000000000000000000000000000000000000" ]; then
            BASE_COMMIT=""
          else
            BASE_COMMIT="$PUSH_BEFORE"
          fi
          HEAD_COMMIT="$HEAD_SHA"
        fi

        if [ -z "$BASE_COMMIT" ]; then
          CHANGED_FILES=$(git ls-files "${CHANGE_PATH}" | wc -l)
        else
          CHANGED_FILES=$(git diff --name-only "${BASE_COMMIT}" "${HEAD_COMMIT}" -- "${CHANGE_PATH}" | wc -l)
        fi

        echo "Changed files in ${CHANGE_PATH}: ${CHANGED_FILES}"

        if [ "$BUMP_VERSION" == "false" ] && [ "$CHANGED_FILES" -eq 0 ]; then
          echo "No changes detected in ${CHANGE_PATH}"
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "version=" >> "$GITHUB_OUTPUT"
          echo "major=" >> "$GITHUB_OUTPUT"
          echo "minor=" >> "$GITHUB_OUTPUT"
          echo "patch=" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        echo "changed=true" >> "$GITHUB_OUTPUT"

        # The glob requires three dot-separated parts on purpose. This repo also
        # publishes floating "<pattern><major>" and "<pattern><major>.<minor>"
        # tags next to the full ones; without the constraint `sort -V | tail -1`
        # could return e.g. "v2", and splitting that on "." would leave MINOR
        # and PATCH empty and break the arithmetic below.
        #
        # When version_line is set, restrict the lookup to that major line so a
        # maintenance branch keeps releasing patches on its own major instead of
        # jumping to a newer major released on another branch. Empty preserves
        # the previous behavior (highest tag matching the pattern).
        if [ -n "$VERSION_LINE" ]; then
          # Guard: version_line is interpolated into the tag glob, so it must be
          # a plain numeric major (no wildcards / unexpected matches).
          if ! [[ "$VERSION_LINE" =~ ^[0-9]+$ ]]; then
            echo "::error::version_line must be a numeric major version (got '${VERSION_LINE}')"
            exit 1
          fi
          LAST_TAG=$(git tag -l "${TAG_PATTERN}${VERSION_LINE}.*.*" | sort -V | tail -n 1)
        else
          LAST_TAG=$(git tag -l "${TAG_PATTERN}*.*.*" | sort -V | tail -n 1)
        fi

        if [ -z "$LAST_TAG" ]; then
          # No tag yet: seed the pinned line at <version_line>.0.0 so the first
          # release lands on the intended major (0.0.0 when unpinned, as before).
          CURRENT_VERSION="${VERSION_LINE:-0}.0.0"
          echo "No existing tag found, starting with ${CURRENT_VERSION}"
        else
          echo "Found last tag: ${LAST_TAG}"
          CURRENT_VERSION=${LAST_TAG#"${TAG_PATTERN}"}
        fi

        echo "Current version: ${CURRENT_VERSION}"

        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
        MAJOR=${MAJOR#v}

        # A malformed tag would otherwise reach the arithmetic below and fail
        # with a message that says nothing about the actual cause.
        for part in "$MAJOR" "$MINOR" "$PATCH"; do
          if ! [[ "$part" =~ ^[0-9]+$ ]]; then
            echo "::error::tag '${LAST_TAG}' does not parse as MAJOR.MINOR.PATCH"
            exit 1
          fi
        done

        # Determine the highest version bump across all commits
        # Priority: MAJOR > MINOR > PATCH (default)
        BUMP_TYPE="PATCH"

        # For schedule and workflow_dispatch events, always use PATCH bump and skip commit analysis
        if [ "$EVENT_NAME" == "schedule" ] || [ "$EVENT_NAME" == "workflow_dispatch" ]; then
          echo "Event type is ${EVENT_NAME} - forcing PATCH bump and skipping commit message analysis"
          BUMP_TYPE="PATCH"
        else
          echo "=== Analyzing commit messages ==="

          # Get all commits to analyze
          if [ "$EVENT_NAME" == "pull_request" ]; then
            # For PRs, get all commits between base and head
            COMMIT_SUBJECTS=$(git log --pretty=%s "${BASE_COMMIT}..${HEAD_COMMIT}")
          else
            # For pushes, analyze commits in the range
            if [ -z "$BASE_COMMIT" ]; then
              # First push, analyze all commits
              COMMIT_SUBJECTS=$(git log --pretty=%s "${HEAD_COMMIT}")
            else
              COMMIT_SUBJECTS=$(git log --pretty=%s "${BASE_COMMIT}..${HEAD_COMMIT}")
            fi
          fi

          echo "Commit subjects to analyze:"
          echo "${COMMIT_SUBJECTS}"
          echo ""
          echo "== End of commit subjects =="

          # Subjects only (%s, not %B): a body mentioning "(MINOR)" in prose -
          # a revert note, a quoted message - must not move the version.
          if echo "$COMMIT_SUBJECTS" | grep -q "(MAJOR)"; then
            echo "MAJOR version bump detected in commits"
            BUMP_TYPE="MAJOR"
          elif echo "$COMMIT_SUBJECTS" | grep -q "(MINOR)"; then
            echo "MINOR version bump detected in commits"
            BUMP_TYPE="MINOR"
          else
            echo "PATCH version bump (default)"
            BUMP_TYPE="PATCH"
          fi
        fi

        # A pinned line must stay on its major; a (MAJOR) bump would leave it.
        if [ -n "$VERSION_LINE" ] && [ "$BUMP_TYPE" == "MAJOR" ]; then
          echo "::error::(MAJOR) detected while version_line is pinned to ${VERSION_LINE}; a major bump would leave the pinned line. Drop the pin or the (MAJOR) marker."
          exit 1
        fi

        echo "Selected bump type: ${BUMP_TYPE}"

        # Apply the version bump
        if [ "$BUMP_TYPE" == "MAJOR" ]; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif [ "$BUMP_TYPE" == "MINOR" ]; then
          MINOR=$((MINOR + 1))
          PATCH=0
        else
          PATCH=$((PATCH + 1))
        fi

        NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

        echo "=== Version Information ==="
        echo "New version: ${NEW_VERSION}"

        echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
        echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
        echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
        echo "patch=${PATCH}" >> "$GITHUB_OUTPUT"
