name: Release Tags
description: >-
  Publish an immutable tag for a semantic version, optionally next to the two
  floating major/minor tags, so consumers can pin either an exact release or a
  moving line.

inputs:
  version:
    description: 'Semantic version to publish, e.g. "1.4.2".'
    required: true
  tag_prefix:
    description: >-
      Prefix in front of the version. "v" yields v1.4.2 / v1.4 / v1. Use a
      per-component prefix such as "my-action-v" when one repository releases
      several independently versioned things.
    required: false
    default: 'v'
  floating_tags:
    description: >-
      Publish the floating "<prefix><major>" and "<prefix><major>.<minor>"
      tags next to the immutable full one. Off by default: most releases are
      deployed by exact version, and a repository releasing several
      components would otherwise carry two moving tags per component. Turn it
      on where consumers pin a moving line, the way this repository's own
      actions are consumed as "@v1".
    required: false
    default: 'false'
  dry_run:
    description: 'Print what would be tagged and pushed, change nothing.'
    required: false
    default: 'false'

outputs:
  full:
    description: 'The immutable tag, e.g. v1.4.2'
    value: ${{ steps.publish.outputs.full }}
  minor:
    description: 'The floating minor tag, e.g. v1.4. Empty unless floating_tags is on.'
    value: ${{ steps.publish.outputs.minor }}
  major:
    description: 'The floating major tag, e.g. v1. Empty unless floating_tags is on.'
    value: ${{ steps.publish.outputs.major }}

runs:
  using: composite
  steps:
    - name: Publish tags
      id: publish
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        TAG_PREFIX: ${{ inputs.tag_prefix }}
        FLOATING_TAGS: ${{ inputs.floating_tags }}
        DRY_RUN: ${{ inputs.dry_run }}
      run: |
        set -euo pipefail

        if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::version must be MAJOR.MINOR.PATCH, got '${VERSION}'"
          exit 1
        fi

        if [ "$FLOATING_TAGS" != "true" ] && [ "$FLOATING_TAGS" != "false" ]; then
          echo "::error::floating_tags must be true or false, got '${FLOATING_TAGS}'"
          exit 1
        fi

        IFS='.' read -r major_num minor_num _ <<< "$VERSION"

        full="${TAG_PREFIX}${VERSION}"
        minor="${TAG_PREFIX}${major_num}.${minor_num}"
        major="${TAG_PREFIX}${major_num}"

        # Reported as empty rather than as a name that was never published:
        # a caller must not pin a tag this run did not create.
        if [ "$FLOATING_TAGS" = "false" ]; then
          minor=""
          major=""
        fi

        {
          echo "full=${full}"
          echo "minor=${minor}"
          echo "major=${major}"
        } >> "$GITHUB_OUTPUT"

        # Tags are only visible to `git tag -l` when they were fetched. On a
        # shallow or tagless checkout the existence check below would pass by
        # accident and a released version could be silently rewritten.
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "::error::shallow checkout - use actions/checkout with fetch-depth: 0"
          exit 1
        fi

        # The full version is immutable: it is what people pin for exact
        # reproducibility. Refusing here is the point.
        if git rev-parse -q --verify "refs/tags/${full}" >/dev/null; then
          echo "::error::${full} already exists and will not be overwritten"
          exit 1
        fi

        if [ "$DRY_RUN" = "true" ]; then
          if [ "$FLOATING_TAGS" = "true" ]; then
            plain="${full}, ${minor} and ${major}"
            marked="\`${full}\`, \`${minor}\` and \`${major}\`"
          else
            plain="${full}"
            marked="\`${full}\`"
          fi
          echo "Dry run - would publish ${plain} at ${GITHUB_SHA}"
          {
            echo "### Dry run"
            echo ""
            echo "Would publish ${marked}."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        git tag --annotate "$full" -m "Release ${VERSION}"
        git push origin "$full"

        if [ "$FLOATING_TAGS" = "true" ]; then
          git tag --annotate --force "$minor" -m "Release ${VERSION}"
          git tag --annotate --force "$major" -m "Release ${VERSION}"

          # The floating tags move backwards as well as forwards, so they need
          # --force on the remote too.
          git push --force origin "$minor"
          git push --force origin "$major"
        fi

        {
          echo "### Release ${VERSION}"
          echo ""
          echo "| Tag | Points at | Moves |"
          echo "|---|---|---|"
          echo "| \`${full}\` | \`${GITHUB_SHA::7}\` | never |"
          if [ "$FLOATING_TAGS" = "true" ]; then
            echo "| \`${minor}\` | \`${GITHUB_SHA::7}\` | with every patch |"
            echo "| \`${major}\` | \`${GITHUB_SHA::7}\` | with every compatible release |"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
