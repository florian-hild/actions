---
name: Security scan
run-name: Security scan

# Trivy over this repository, through the shared workflow.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  schedule:
    - cron: "0 6 * * 1" # new findings appear without the code changing
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Trivy
    permissions:
      contents: read
      pull-requests: write
    uses: florian-hild/reusable-workflows/.github/workflows/security-scan.yml@472932839e3abe77c72b5759c75ad29cc210d223 # v2
